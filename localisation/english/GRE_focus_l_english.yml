l_english:
 # Greece focus tree
 GRE_the_last_free_greeks:0 "The Last Free Greeks"
 GRE_the_last_free_greeks_desc:0 "Polygyros is all that remains of free Greece. Athens, Salonika and the islands groan under Aragonese rule. But every Greek in the occupied lands still looks north to the last Hellenic flag."
 GRE_the_philiki_etaireia_reborn:0 "The Philiki Etaireia Reborn"
 GRE_the_philiki_etaireia_reborn_desc:0 "A century ago the Friendly Society plotted the liberation of Greece from the Turks. Its heirs now plot liberation from Aragon, in cellars from Salonika to Nafplio."
 GRE_royalist_committees:0 "Royalist Committees in Salonika"
 GRE_royalist_committees_desc:0 "In Macedonia and Thessaly the old families remain loyal to the Greek crown. When the signal comes, their committees will raise the north for the king."
 GRE_smuggle_arms_across_the_aegean:0 "Smuggle Arms Across the Aegean"
 GRE_smuggle_arms_across_the_aegean_desc:0 "Fishing boats by day, gun-runners by night. Every rifle that reaches the occupied lands is one more Aragonese garrison that will not sleep soundly."
 GRE_the_athenian_republicans:0 "Reach Out to the Athenian Republicans"
 GRE_the_athenian_republicans_desc:0 "The rebels of Athens and the Peloponnese want no king. They want a Hellenic Republic, and when the uprising comes they will fight us as readily as Aragon. Still, keeping a line open to Athens will put more guns in the south, and one day there may be a peace to make."
 GRE_the_great_uprising:0 "The Great Uprising"
 GRE_the_great_uprising_desc:0 "The signal fires burn on Mount Olympus. Salonika, Volos and Florina rise for the king, while Athens and the islands proclaim a Hellenic Republic that recognises no king. Three armies now fight over Greece."
 GRE_a_crown_for_all_hellenes:0 "A Crown for All Hellenes"
 GRE_a_crown_for_all_hellenes_desc:0 "The royalists of the north fought for the king. Greece will be liberated as a kingdom, and the republican experiment in Athens is a dangerous distraction."
 GRE_bring_athens_to_heel:0 "Bring Athens to Heel"
 GRE_bring_athens_to_heel_desc:0 "The war with Aragon is over. Every soldier of the crown now marches on Athens, and the self-proclaimed republic will submit."
 GRE_the_king_in_athens:0 "The King in Athens"
 GRE_the_king_in_athens_desc:0 "Athens is the heart of Hellas. The court will move from little Polygyros to the city of Pericles."
 GRE_the_republican_pact:0 "The Republican Pact"
 GRE_the_republican_pact_desc:0 "Greeks killing Greeks while Aragon watches is madness. The king will step aside, the guns will fall silent between Polygyros and Athens, and Greece will join the Hellenic Republic as one free nation."
 GRE_union_with_the_republic:0 "Union with the Hellenic Republic"
 GRE_union_with_the_republic_desc:0 "With Aragon beaten back, the two Greek states will become one. The Hellenic Republic and the old kingdom unite under a single constitution in Athens."
 GRE_a_constitution_for_hellas:0 "A Constitution for Hellas"
 GRE_a_constitution_for_hellas_desc:0 "A written constitution, a free parliament and an end to the arbitrary rule of kings and foreign governors."
 GRE_hellas_reborn:0 "Hellas Reborn"
 GRE_hellas_reborn_desc:0 "From Salonika to Sparta, Greece is free and united for the first time in living memory."
 GRE_the_megali_idea:0 "The Megali Idea"
 GRE_the_megali_idea_desc:0 "The Great Idea: a Greek state embracing every Greek, with Constantinople as its capital. The City is held by Aragon, and Smyrna too. Not for long."
 GRE_appeal_to_occitania:0 "Appeal to Occitania"
 GRE_appeal_to_occitania_desc:0 "The enemy of our enemy is the strongest power in Europe. Occitania has no love for Greeks, but it will gladly arm anyone who bleeds Aragon."
 GRE_occitan_military_advisors:0 "Occitan Military Advisors"
 GRE_occitan_military_advisors_desc:0 "Officers from the army that beat Aragon again and again will teach our guerrillas how it is done."
 GRE_the_occitan_volunteer_corps:0 "The Occitan Volunteer Corps"
 GRE_the_occitan_volunteer_corps_desc:0 "Occitania will not go to war for Greece. But nobody in Toulouse will stop veterans of the Aragonese wars from taking leave, crossing the Adriatic and fighting under a Greek flag."
 GRE_byzantine_brotherhood:0 "Byzantine Brotherhood"
 GRE_byzantine_brotherhood_desc:0 "The Byzantine Empire also lost Thessaly and Macedonia to Aragon. Orthodox brothers should not fight each other while the Catalans rule our lands."
 GRE_the_klephts:0 "The Klephts"
 GRE_the_klephts_desc:0 "The mountain bandits who fought the Turks for four centuries live on in every Greek village. Their tactics will be the backbone of our army."
 GRE_the_evzones:0 "The Evzones"
 GRE_the_evzones_desc:0 "The kilted mountain infantry of the old royal guard will be revived as the elite of the liberation army."
 GRE_mountain_warfare:0 "Mountain Warfare"
 GRE_mountain_warfare_desc:0 "Pindus and Olympus are our fortresses. Our soldiers will learn to fight in them."
 GRE_the_diaspora_volunteers:0 "Volunteers from the Diaspora"
 GRE_the_diaspora_volunteers_desc:0 "Greeks from Alexandria to Odessa answer the call of the motherland."
 GRE_rebuild_polygyros:0 "Rebuild Polygyros"
 GRE_rebuild_polygyros_desc:0 "Our only province must also be our workshop."
 GRE_aegean_fishing_fleets:0 "Aegean Fishing Fleets"
 GRE_aegean_fishing_fleets_desc:0 "The fishing boats of Chalkidiki will become the core of a Greek navy, and of our smuggling routes."
 GRE_industry_of_a_free_greece:0 "Industry of a Free Greece"
 GRE_industry_of_a_free_greece_desc:0 "The workshops of Athens and Salonika will now arm Greeks instead of Aragonese."
 GRE_the_court_at_polygyros:0 "The Court at Polygyros"
 GRE_the_court_at_polygyros_desc:0 "King Andreas Kolokotronis keeps a court of exiles in a provincial town hall: old generals, deposed mayors and the great-grandsons of the heroes of 1821. It is a small court, but it is the only Greek one left."
 GRE_the_holy_mountain:0 "The Holy Mountain"
 GRE_the_holy_mountain_desc:0 "On Mount Athos, at the tip of our own peninsula, twenty monasteries have prayed for Greece for a thousand years. The abbots have sent word: the Holy Mountain stands with the king."
 GRE_the_monastery_presses:0 "The Monastery Presses"
 GRE_the_monastery_presses_desc:0 "The old printing presses of Athos once printed psalters. Now they print pamphlets, carried by pilgrims and mule drivers into every village Aragon holds."
 GRE_refugees_of_macedonia:0 "Refugees of Macedonia"
 GRE_refugees_of_macedonia_desc:0 "Thousands of Greeks have fled Aragonese Macedonia into Chalkidiki. They sleep in churches and olive groves, and every one of them wants to go home with a rifle."
 GRE_the_crown_prince:0 "The Crown Prince Takes Command"
 GRE_the_crown_prince_desc:0 "Crown Prince Konstantinos is young, impatient and adored by the refugee volunteers. His father has finally agreed to let him command."
 GRE_the_sacred_band:0 "The Sacred Band"
 GRE_the_sacred_band_desc:0 "Three hundred volunteers swear an oath before the relics of Athos to die rather than retreat, as the Sacred Band of Ypsilantis did in 1821."
 GRE_return_of_the_refugees:0 "Return of the Refugees"
 GRE_return_of_the_refugees_desc:0 "Salonika is Greek again, and the refugee camps of Chalkidiki empty in a week. The roads north are full of carts, icons and children."
 GRE_rebuild_the_burned_villages:0 "Rebuild the Burned Villages"
 GRE_rebuild_the_burned_villages_desc:0 "Aragonese reprisals left a line of ashes from Florina to Volos. Every rebuilt church and schoolhouse is a promise that it will not happen again."
 GRE_the_language_question:0 "The Language Question"
 GRE_the_language_question_desc:0 "Should a free Greece write in Katharevousa, the purified tongue of the courts and the Church, or in Demotiki, the Greek its people actually speak? The quarrel has ended friendships and started riots."
 GRE_katharevousa:0 "Katharevousa"
 GRE_katharevousa_desc:0 "The language of Byzantium and the Gospels will be the language of the state. A nation reborn must sound like the nation it once was."
 GRE_demotiki:0 "Demotiki"
 GRE_demotiki_desc:0 "Schoolchildren will learn the Greek their grandmothers speak. Literacy and pride will spread faster than any decree from Athens."
 GRE_restore_the_acropolis:0 "Restore the Acropolis"
 GRE_restore_the_acropolis_desc:0 "Aragonese officers used the Parthenon as a parade ground and the Erechtheion as a stable. Greek scaffolding now climbs its columns."
 GRE_the_reconstruction_ministry:0 "The Reconstruction Ministry"
 GRE_the_reconstruction_ministry_desc:0 "A ministry of engineers, bankers and shipowners is given one task: turn three liberated provinces into a country."
 GRE_the_athens_salonika_railway:0 "The Athens-Salonika Railway"
 GRE_the_athens_salonika_railway_desc:0 "The line was cut in a dozen places during the uprising. Rebuilt, it will tie the south to the north for good."
 GRE_the_laurium_mines:0 "The Laurium Mines"
 GRE_the_laurium_mines_desc:0 "The silver of Laurium paid for the fleet that won at Salamis. Its old shafts still hold lead, iron and zinc."
 GRE_the_port_of_piraeus:0 "The Port of Piraeus"
 GRE_the_port_of_piraeus_desc:0 "The great harbour of Athens was a dead dock under Aragon. Greek merchant captains are coming home to it."
 GRE_the_thessalian_granary:0 "The Thessalian Granary"
 GRE_the_thessalian_granary_desc:0 "The plain of Thessaly can feed all of Greece, if its estates are worked instead of requisitioned."
 GRE_salonika_tobacco:0 "The Salonika Tobacco Monopoly"
 GRE_salonika_tobacco_desc:0 "Macedonian tobacco is the finest in the Mediterranean. A state monopoly will turn its smoke into rifles."
 GRE_a_modern_greek_economy:0 "A Modern Greek Economy"
 GRE_a_modern_greek_economy_desc:0 "Greece is no longer a bandit kingdom on a peninsula. It has ports, rails, mines and factories, and it means to keep them."
 GRE_from_insurgents_to_army:0 "From Insurgents to an Army"
 GRE_from_insurgents_to_army_desc:0 "Bands of klephts, refugee volunteers and deserters from the Aragonese garrisons must become regiments with numbers, officers and supply."
 GRE_the_evelpidon_academy:0 "Reopen the Evelpidon"
 GRE_the_evelpidon_academy_desc:0 "The military academy of the Evelpidon, closed for a generation, reopens its doors. Its first class are veterans of the uprising."
 GRE_the_olympus_line:0 "The Olympus Line"
 GRE_the_olympus_line_desc:0 "If Aragon comes again, it will have to climb. Concrete bunkers will line the passes of Olympus and the Pindus."
 GRE_the_general_staff:0 "A Hellenic General Staff"
 GRE_the_general_staff_desc:0 "The uprising was won by brave men and luck. The next war will be won by planning."
 GRE_aegean_coastal_batteries:0 "Aegean Coastal Batteries"
 GRE_aegean_coastal_batteries_desc:0 "Guns on every headland from Piraeus to Monemvasia. No Aragonese fleet will land troops in Greece unopposed again."
 GRE_the_royal_hellenic_navy:0 "A Hellenic Navy"
 GRE_the_royal_hellenic_navy_desc:0 "A nation of islands and sailors cannot live on fishing boats forever. The first Greek destroyers are laid down at Piraeus."
 GRE_an_army_of_all_hellenes:0 "An Army of All Hellenes"
 GRE_an_army_of_all_hellenes_desc:0 "Royalist and republican, Macedonian and Moreot, islander and mountaineer: one army, one oath, one flag."
 GRE_the_question_of_the_crown:0 "The Question of the Crown"
 GRE_the_question_of_the_crown_desc:0 "King Andreas is old and tired, and the court is crowded with men who want to govern in his name. Greece must decide how a king rules a free people."
 GRE_the_kings_peace:0 "The King's Peace"
 GRE_the_kings_peace_desc:0 "No parties and no generals. The king will govern with the Holy Synod and his council, as a father governs a household."
 GRE_the_generals_regime:0 "The Twelfth of March"
 GRE_the_generals_regime_desc:0 "General Ioannis Varvakis, hero of Florina, has no patience for courtiers or parliaments. With the king's reluctant signature, he suspends the constitution and proclaims a regime of National Regeneration."
 GRE_the_constitutional_crown:0 "The Constitutional Crown"
 GRE_the_constitutional_crown_desc:0 "The king will reign, but parliament will govern. Theodoros Mavrogenis, leader of the moderates who kept the royalist committees alive, becomes the first Prime Minister of a free Greece."
 GRE_the_holy_synod:0 "The Holy Synod"
 GRE_the_holy_synod_desc:0 "The bishops of the Church of Greece sit at the king's council table, and every pulpit preaches loyalty to the crown."
 GRE_the_youth_of_hellas:0 "The Youth of Hellas"
 GRE_the_youth_of_hellas_desc:0 "Every boy and girl in Greece will march, drill and sing for the nation. Varvakis wants a generation that will never be conquered again."
 GRE_the_vouli_reconvenes:0 "The Vouli Reconvenes"
 GRE_the_vouli_reconvenes_desc:0 "For the first time since the Aragonese occupation, the Hellenic Parliament meets in Athens. Royalists and republicans shout at each other, and it is wonderful."
 GRE_long_live_the_king:0 "Long Live the King"
 GRE_long_live_the_king_desc:0 "Whatever the government, the crown endures. King Andreas abdicates in favour of Crown Prince Konstantinos, and the young king is crowned in the cathedral of Athens. Under the King's Peace he rules in person; otherwise he reigns over the government Greece has chosen."
 GRE_president_karavias:0 "President Karavias"
 GRE_president_karavias_desc:0 "Alexandros Karavias led the Athenian rebels in the uprising. With the union done, the united parliament elects him President of the Hellenic Republic."
 GRE_exile_the_dynasty:0 "Exile the Kolokotronis"
 GRE_exile_the_dynasty_desc:0 "A republic cannot share a country with a king who might want his throne back. King Andreas and his family are put on a ship to Alexandria."
 GRE_a_royal_pension:0 "A Royal Pension"
 GRE_a_royal_pension_desc:0 "The old king gave up his crown for Greece. He will keep his title, his villa at Polygyros and the gratitude of the republic."
 GRE_land_reform_in_thessaly:0 "Land Reform in Thessaly"
 GRE_land_reform_in_thessaly_desc:0 "The great estates of Thessaly, many confiscated by Aragonese officers, are broken up and given to the families who work them."
 GRE_the_second_hellenic_republic:0 "The Second Hellenic Republic"
 GRE_the_second_hellenic_republic_desc:0 "A century after the first Hellenic Republic of Kapodistrias, the second is here to stay."
 GRE_the_great_uprising:0 "The Great Uprising"
 GRE_the_great_uprising_desc:0 "All of Greece is in arms against Aragon."
 GRE_klephts:0 "The Klephts"
 GRE_klephts_desc:0 "Greek soldiers fight like the mountain guerrillas of old."
 GRE_march_on_athens:0 "The March on Athens"
 GRE_march_on_athens_desc:0 "With Aragon gone, the whole royal army turns south against the republic."
 GRE_hellenic_constitution:0 "A Constitution for Hellas"
 GRE_hellenic_constitution_desc:0 "Greece is governed by a written constitution and a freely elected parliament."
 GRE_hellas_reborn:0 "Hellas Reborn"
 GRE_hellas_reborn_desc:0 "Greece is free and united."
 GRE_blessing_of_athos:0 "Blessing of the Holy Mountain"
 GRE_blessing_of_athos_desc:0 "The monks of Athos pray for the liberation of Greece, and every Greek knows it."
 GRE_reconstruction_ministry:0 "The Reconstruction Ministry"
 GRE_reconstruction_ministry_desc:0 "Rebuilding a war-torn country is expensive, but it is being done."
 GRE_modern_economy:0 "A Modern Greek Economy"
 GRE_modern_economy_desc:0 "Ports, rails, mines and factories."
 GRE_katharevousa:0 "Katharevousa"
 GRE_katharevousa_desc:0 "The state writes in the purified Greek of the courts and the Church."
 GRE_demotiki:0 "Demotiki"
 GRE_demotiki_desc:0 "The state writes and teaches the Greek its people speak."
 GRE_army_of_all_hellenes:0 "An Army of All Hellenes"
 GRE_army_of_all_hellenes_desc:0 "One army, one oath, one flag."
 GRE_throne_and_altar:0 "Throne and Altar"
 GRE_throne_and_altar_desc:0 "King and Church govern Greece together."
 GRE_national_regeneration:0 "National Regeneration"
 GRE_national_regeneration_desc:0 "General Varvakis promises a Greece that will never be conquered again, and a Greece that does what it is told."
 GRE_constitutional_crown:0 "The Constitutional Crown"
 GRE_constitutional_crown_desc:0 "The king reigns; parliament governs."
 GRE_land_reform:0 "Land to the Tillers"
 GRE_land_reform_desc:0 "The estates of Thessaly belong to those who work them."
 GRE_second_republic:0 "The Second Hellenic Republic"
 GRE_second_republic_desc:0 "A free republic of all the Greeks."
 SPC_greek_insurgency:0 "Greek Insurgency"
 SPC_greek_insurgency_desc:0 "Greek rebels hold the mountains of Macedonia and the streets of Athens. Every garrison in Greece is under attack."
 GRE_hellenic_alliance:0 "Hellenic Alliance"
 greek_uprising.1.t:0 "Revolt in Greece!"
 greek_uprising.1.d:0 "Signal fires burned on Mount Olympus last night. By morning, royalist insurgents had seized Salonika, Volos and Florina and declared for the King of Greece in Polygyros. In Athens, the Peloponnese and the islands, republican militias have proclaimed a Hellenic Republic and refuse to recognise the king. Our garrisons are cut off and under fire across the whole of Greece, though the two rebel governments are already fighting each other as well as us."
 greek_uprising.1.a:0 "Crush the traitors!"
 greek_uprising.2.t:0 "The Greek Question"
 greek_uprising.2.d:0 "A year of fighting has not broken the Greek rebels. Our garrisons are pinned down, the foreign press reports every burned village, and the generals warn that the army is needed elsewhere. Some ministers now quietly suggest that Greece is not worth the cost: recognise the rebel governments and bring the troops home."
 greek_uprising.2.a:0 "Let Greece go. Aragon has bigger enemies."
 greek_uprising.2.b:0 "Never! Not one village will be surrendered."
 greek_uprising.3.t:0 "The Greek Revolt Crushed"
 greek_uprising.3.d:0 "The last rebel strongholds have fallen. Royalist and republican leaders alike have fled into exile or been captured. Order is restored across Greece, and the army can finally turn its attention back to Occitania."
 greek_uprising.3.a:0 "Aragon endures."
 greek_uprising.5.t:0 "Aragon Recognises Greek Independence"
 greek_uprising.5.d:0 "Unable to break our resistance, the Aragonese government has agreed to a ceasefire and withdrawn its garrisons. For the first time in generations, Greeks govern Greek lands. But the war between the royalists of Polygyros and the republicans of Athens goes on: only one of them will rule a free Greece."
 greek_uprising.5.a:0 "Zito i Ellas!"
 greek_uprising.10.a:0 "OK"
