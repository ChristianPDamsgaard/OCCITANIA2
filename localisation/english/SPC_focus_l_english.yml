l_english:
 # Aragon focus tree
 SPC_the_bitter_peace:0 "The Bitter Peace"
 SPC_the_bitter_peace_desc:0 "Once Aragon was the greatest power on earth. Then came the ruinous wars for the Orient, Napoleon's fall, and a century of defeats at the hands of Provence and its upstart Empire of Occitania. Our last gamble, the joint war with Scandinavia, was saved from catastrophe only because the other powers forced Occitania to make peace. Aragon survives on the charity of foreigners. Before the Crown can rise again, its people must decide who will lead the reckoning."
 SPC_escotets_mandate:0 "Escotet's Mandate"
 SPC_escotets_mandate_desc:0 "Carles Escotet seized power promising that Aragon would never again bow to Occitania. Now he must prove that the Moviment can deliver what the old order could not."
 SPC_unify_the_moviment:0 "Unify the Moviment"
 SPC_unify_the_moviment_desc:0 "The Moviment is a quarrelsome coalition of veterans, syndicalists and monarchists. Escotet will bind its factions into a single instrument of national will."
 SPC_black_shirts_of_saragossa:0 "The Black Shirts of Saragossa"
 SPC_black_shirts_of_saragossa_desc:0 "The street fighters of Saragossa carried Escotet to power. Organised into a national militia, they will guard the regime at home while the army looks abroad."
 SPC_purge_the_defeatists:0 "Purge the Defeatists"
 SPC_purge_the_defeatists_desc:0 "Those who signed the shameful peace treaties still sit in our ministries and officer messes. They will be removed, and the wound of defeat will become a fire of vengeance."
 SPC_ministry_of_national_spirit:0 "Ministry of National Spirit"
 SPC_ministry_of_national_spirit_desc:0 "Newspapers, radio and cinema will speak with one voice: the voice of an Aragon that remembers what was taken from it."
 SPC_the_corporate_state:0 "The Corporate State"
 SPC_the_corporate_state_desc:0 "Employers and workers will be bound together in state syndicates, ending strikes and directing every factory toward the needs of the nation."
 SPC_aragonese_youth_front:0 "The Aragonese Youth Front"
 SPC_aragonese_youth_front_desc:0 "The generation that grew up under defeat will be the generation that avenges it. Every boy in Aragon will learn to march, to shoot and to remember."
 SPC_the_cabdills_cult:0 "The Cult of the Cabdill"
 SPC_the_cabdills_cult_desc:0 "Escotet is no longer merely a politician. He is the Cabdill, the leader who embodies the Aragonese nation and its destiny."
 SPC_total_mobilization:0 "Total Mobilisation"
 SPC_total_mobilization_desc:0 "Peace was only ever a pause between wars. The economy of the Crown will be placed on a permanent war footing."
 SPC_the_new_aragonese_order:0 "The New Aragonese Order"
 SPC_the_new_aragonese_order_desc:0 "Aragon will not fight alone. The Pact of Saragossa will bind our dominions and like-minded states into a bloc that Occitania cannot break."
 SPC_aragon_above_all:0 "Aragon Above All"
 SPC_aragon_above_all_desc:0 "The nation is reborn, the army is ready and the people are united. All that remains is to take back what is ours."
 SPC_whispers_in_the_palace:0 "Whispers in the Palace"
 SPC_whispers_in_the_palace_desc:0 "In the shuttered halls of the Aljafería, generals and grandees speak quietly of the exiled royal house. Escotet promised glory and delivered only more defeats."
 SPC_the_officers_plot:0 "The Officers' Plot"
 SPC_the_officers_plot_desc:0 "The officer corps never forgave Escotet for the purges of its ranks. A conspiracy of colonels now waits only for the word of the rightful king."
 SPC_the_crown_reclaimed:0 "The Crown Reclaimed"
 SPC_the_crown_reclaimed_desc:0 "At dawn the army seizes the ministries and Escotet is put on a ship into exile. Jaume V enters Saragossa to the sound of church bells. The Crown of Aragon lives again."
 SPC_the_eagle_returns:0 "The Eagle Returns"
 SPC_the_eagle_returns_desc:0 "Some conspirators want the old House of Barcelona; others remember that Aragon's last age of glory came under Napoleon, the Corsican who made Aragon master of Europe. His great-grandnephew, Napoleó IV Bonaparte, is ready to take up the imperial crown."
 SPC_the_royal_council:0 "The Royal Council"
 SPC_the_royal_council_desc:0 "The king will govern through a council of nobles, bishops and marshals: men of tradition who know that a nation is built on loyalty, not slogans."
 SPC_restore_the_usatges:0 "Restore the Usatges"
 SPC_restore_the_usatges_desc:0 "The ancient Usatges of Barcelona bound king and subject in mutual obligation. Restoring them reminds every Aragonese that the Crown is older than any party."
 SPC_a_noble_officer_corps:0 "A Noble Officer Corps"
 SPC_a_noble_officer_corps_desc:0 "The sons of the great houses will once more lead the king's armies, as their ancestors did at Muret and Palermo."
 SPC_the_mediterranean_crown:0 "The Mediterranean Crown"
 SPC_the_mediterranean_crown_desc:0 "Montpellier and Provence once owed homage to the Crown of Aragon. Provence repaid that debt by building the empire that humbled us. The Crown remembers its old rights, even if Occitania pretends to forget them."
 SPC_alliance_of_crowns:0 "The Alliance of Crowns"
 SPC_alliance_of_crowns_desc:0 "Thrones must stand together against the tide of republicans and demagogues. The Crown of Aragon will gather its dominions into a royal alliance."
 SPC_the_second_conqueror:0 "The Second Conqueror"
 SPC_the_second_conqueror_desc:0 "Jaume I won Majorca and Valencia and earned the name of Conqueror. His descendant intends to earn it again."
 SPC_voices_of_the_corts:0 "Voices of the Corts"
 SPC_voices_of_the_corts_desc:0 "The Corts were silenced when Escotet took power, but their deputies never stopped meeting in cellars and cafes. Now their pamphlets are everywhere."
 SPC_the_valencia_manifesto:0 "The Valencia Manifesto"
 SPC_the_valencia_manifesto_desc:0 "From Valencia, a coalition of liberals, socialists and regionalists publishes its demands: free elections, a free press and an end to the Cabdill's wars."
 SPC_the_fall_of_escotet:0 "The Fall of Escotet"
 SPC_the_fall_of_escotet_desc:0 "General strikes paralyse the cities and the garrisons refuse to fire on the crowds. Escotet's government collapses, but his black shirts will not surrender without a fight."
 SPC_truth_and_reconciliation:0 "Truth and Reconciliation"
 SPC_truth_and_reconciliation_desc:0 "The republic will not build itself on new purges. Former enemies will be offered amnesty, and the nation will finally mourn its defeats instead of feeding on them."
 SPC_free_corts_elections:0 "Free Elections to the Corts"
 SPC_free_corts_elections_desc:0 "For the first time in a generation, Aragonese citizens will choose their own deputies."
 SPC_an_army_of_citizens:0 "An Army of Citizens"
 SPC_an_army_of_citizens_desc:0 "The army that served the Cabdill must learn to serve the republic. Purged of political officers, it will be smaller, better trained and loyal to the constitution."
 SPC_open_the_markets:0 "Open the Markets"
 SPC_open_the_markets_desc:0 "Autarky impoverished Aragon. The republic will trade with the world and let prosperity rebuild what war destroyed."
 SPC_rapprochement_with_catalonia:0 "Rapprochement with Catalonia"
 SPC_rapprochement_with_catalonia_desc:0 "Catalonia took our northern provinces, but it too fears Occitan power. Old enemies may yet become partners."
 SPC_the_middle_sea_entente:0 "The Middle Sea Entente"
 SPC_the_middle_sea_entente_desc:0 "A free Aragon will stand with the free peoples of Europe. Our old friends in Scandinavia are invited to join a defensive entente against Occitan aggression."
 SPC_collective_security:0 "Collective Security"
 SPC_collective_security_desc:0 "If Occitania threatens the peace of the Middle Sea again, the Entente will answer together, and this time the lost provinces will be freed."
 SPC_the_lost_provinces:0 "The Lost Provinces"
 SPC_the_lost_provinces_desc:0 "Corsica, Limousin and Poitou in Occitan hands. Paris and the Loire under Catalonia. Kent under England. Every schoolchild in Aragon can recite the list."
 SPC_fortify_the_pyrenean_line:0 "Fortify the Pyrenean Line"
 SPC_fortify_the_pyrenean_line_desc:0 "Before Aragon can strike, it must be certain it will not be struck. The passes of the Pyrenees will be sealed with concrete and steel."
 SPC_a_debt_written_in_blood:0 "A Debt Written in Blood"
 SPC_a_debt_written_in_blood_desc:0 "Aragon's enemies wrote the peace treaties in our blood. That debt will be repaid in kind."
 SPC_renew_the_scandinavian_pact:0 "Renew the Scandinavian Pact"
 SPC_renew_the_scandinavian_pact_desc:0 "Scandinavia marched with us in the last war, striking Occitania from the north while we attacked from the south. That alliance nearly worked. It must be renewed."
 SPC_the_pincer_plan:0 "The Pincer Plan"
 SPC_the_pincer_plan_desc:0 "The two-pronged attack failed last time because Aragon's prong broke first. Joint staff talks with Stockholm will make sure that does not happen again."
 SPC_the_corsican_question:0 "The Corsican Question"
 SPC_the_corsican_question_desc:0 "Corsica gave Aragon its greatest son: Napoleon, Emperor of Aragon, born in Ajaccio. That his island now flies the Occitan flag is an insult no Aragonese can forgive. It also guards the sea lanes between Sardinia and our Italian provinces."
 SPC_the_march_on_rome:0 "The March on Rome"
 SPC_the_march_on_rome_desc:0 "Our legions hold Naples and Venice, yet the Eternal City lies in Occitan hands. Rome must become Aragonese."
 SPC_the_road_to_paris:0 "The Road to Paris"
 SPC_the_road_to_paris_desc:0 "Catalonia's capture of Paris and the Loire was the deepest humiliation of the last war. The road north must be reopened."
 SPC_unfinished_business_in_england:0 "Unfinished Business in England"
 SPC_unfinished_business_in_england_desc:0 "We hold Ireland, Scotland and Wales, but the English still sit in Kent. The isles will be whole under the Crown."
 SPC_the_war_of_revanche:0 "The War of Revanche"
 SPC_the_war_of_revanche_desc:0 "In the last war Aragon was nearly overrun and was saved only by foreign threats. This time no one will need to save us. Aragon marches on Occitania to take back what was stolen."
 SPC_break_the_occitan_hegemony:0 "Break the Occitan Hegemony"
 SPC_break_the_occitan_hegemony_desc:0 "Occitania's armies are broken. Its southern provinces, long tied to Aragon by blood and trade, will never again be used as a springboard against us."
 SPC_the_eastern_dominions:0 "The Eastern Dominions"
 SPC_the_eastern_dominions_desc:0 "Greece, the Balkans and Anatolia are the Crown's newest and least loyal lands. Roads and garrisons will tie them to Saragossa."
 SPC_the_anatolian_mines:0 "The Anatolian Mines"
 SPC_the_anatolian_mines_desc:0 "The hills of Aydin and Konya hide chromium and iron that our factories badly need."
 SPC_athens_and_neopatria:0 "Athens and Neopatria"
 SPC_athens_and_neopatria_desc:0 "The Catalan Company ruled the Duchies of Athens and Neopatria six centuries ago. With Thessaly and Western Macedonia taken from the Byzantines, the old duchies can be restored to the Crown."
 SPC_the_byzantine_question:0 "The Byzantine Question"
 SPC_the_byzantine_question_desc:0 "In exchange for Thessaly the Byzantines were handed Kastamonu and Ankara, and now they eye Attica and the Aegean as well. It is time to take back the Anatolian provinces and end the Byzantine remnant's ambitions."
 SPC_pacify_the_highlands:0 "Pacify the Highlands"
 SPC_pacify_the_highlands_desc:0 "The mountain clans of Albania and Montenegro have never truly accepted Aragonese rule. Roads, schools and garrisons will change that, and their warriors will fill our regiments."
 SPC_the_african_dominions:0 "The African Dominions"
 SPC_the_african_dominions_desc:0 "From Western Sahara to São Tomé, the dominions of the Crown stood by Aragon when Europe abandoned it. Their loyalty will be rewarded."
 SPC_colonial_levies:0 "Colonial Levies"
 SPC_colonial_levies_desc:0 "The dominions will raise regiments for the Crown. In return, their veterans will be granted Aragonese citizenship."
 SPC_the_dream_of_the_orient:0 "The Dream of the Orient"
 SPC_the_dream_of_the_orient_desc:0 "For three centuries Aragonese kings chased the glory of Alexander and Caesar in the East, and for three centuries the East swallowed our armies. The dream drained the treasury that once made Aragon the world's greatest power. Now Aragon must decide: revive it, or bury it for good."
 SPC_heirs_of_alexander:0 "Heirs of Alexander"
 SPC_heirs_of_alexander_desc:0 "Our ancestors failed because they were half-hearted. Modern armies, railways and steamships will succeed where galleys and pikes did not. The Orient will be ours."
 SPC_cyprus_and_the_levantine_sea:0 "Cyprus and the Levantine Sea"
 SPC_cyprus_and_the_levantine_sea_desc:0 "Every eastern crusade of the Crown began at Cyprus. The Ilkhanate holds it now."
 SPC_caesars_road_to_alexandria:0 "Caesar's Road to Alexandria"
 SPC_caesars_road_to_alexandria_desc:0 "Caesar took Egypt and made himself master of the Middle Sea. The Baruun Khanate's grip on the Nile is weaker than it looks."
 SPC_the_crusader_compact:0 "The Crusader Compact"
 SPC_the_crusader_compact_desc:0 "The Kingdom of Jerusalem is a Christian island in a Mongol sea. It needs a protector, and Aragon needs a foothold in the Holy Land."
 SPC_the_march_of_alexander:0 "The March of Alexander"
 SPC_the_march_of_alexander_desc:0 "From the Nile, Alexander marched to Mesopotamia. Mosul and Baghdad, the jewels of the Ilkhanate, will mark the end of our road."
 SPC_where_our_fathers_failed:0 "Where Our Fathers Failed"
 SPC_where_our_fathers_failed_desc:0 "The Orient that ruined Aragon now bows to it. Three centuries of failure have been redeemed."
 SPC_bury_the_oriental_dream:0 "Bury the Oriental Dream"
 SPC_bury_the_oriental_dream_desc:0 "The East made fools of twenty kings. Aragon's future and its lost provinces lie in Europe, not in the deserts of the Levant."
 SPC_trade_not_conquest:0 "Trade, Not Conquest"
 SPC_trade_not_conquest_desc:0 "What our armies never won, our merchants can. Smyrna will become the Crown's gateway to the Levant trade."
 SPC_bring_the_legions_home:0 "Bring the Legions Home"
 SPC_bring_the_legions_home_desc:0 "The garrisons scattered across Anatolia and the islands will come home to guard the Pyrenees."
 SPC_eyes_on_the_pyrenees:0 "Eyes on the Pyrenees"
 SPC_eyes_on_the_pyrenees_desc:0 "Every soldier, every peseta and every ship is now committed to one goal: the lost provinces."
 SPC_the_legacy_of_guillen_iv:0 "The Legacy of Guillen IV"
 SPC_the_legacy_of_guillen_iv_desc:0 "King Guillen IV led Aragon's own crusade, drove the Turks out of France, then pressed his claim to the English throne. Crowned Emperor of the Triple Monarchy, he ruled Aragon, France and England as one. Restoring his empire would undo every humiliation since."
 SPC_the_french_inheritance:0 "The French Inheritance"
 SPC_the_french_inheritance_desc:0 "Guillen's crusaders, not the Catalans, freed France from the Turks. Normandy, Brittany and Champagne belong to his heirs."
 SPC_guillens_english_claim:0 "Guillen's English Claim"
 SPC_guillens_english_claim_desc:0 "Guillen was crowned in London by right of blood, and his line has never renounced that right. The English heartland will answer to the Triple Crown again."
 SPC_the_imperial_regalia:0 "The Imperial Regalia"
 SPC_the_imperial_regalia_desc:0 "The three crowns of Guillen IV lie in the treasury of Saragossa, unworn for a century. They will be brought out and shown to the people."
 SPC_the_northern_english_counties:0 "The Northern English Counties"
 SPC_the_northern_english_counties_desc:0 "We already rule Yorkshire and Lancashire. Aragonese schools, courts and railways will make their people subjects of the Triple Crown in spirit as well as law."
 SPC_emperor_of_three_crowns:0 "Emperor of Three Crowns"
 SPC_emperor_of_three_crowns_desc:0 "Aragon, France and England are united once more under one emperor. The world's first superpower has returned."
 SPC_the_plan_of_restoration:0 "The Plan of Restoration"
 SPC_the_plan_of_restoration_desc:0 "Defeat has left our factories idle and our treasury empty. A national plan will rebuild Aragonese industry from the ground up."
 SPC_rebuild_the_heartland:0 "Rebuild the Heartland"
 SPC_rebuild_the_heartland_desc:0 "Aragon is still a land of peasants and vineyards; its few factories cluster in Valencia and Catalonia. Their workshops will be the first to grow, and the first to draw labour from the countryside."
 SPC_the_italian_workshops:0 "The Italian Workshops"
 SPC_the_italian_workshops_desc:0 "Naples and Apulia are home to millions of skilled hands. Investment in the south of Italy will turn them toward the Crown's needs."
 SPC_roads_of_the_crown:0 "Roads of the Crown"
 SPC_roads_of_the_crown_desc:0 "An empire scattered across the Middle Sea must move men and goods quickly between its provinces."
 SPC_the_arsenal_of_saragossa:0 "The Arsenal of Saragossa"
 SPC_the_arsenal_of_saragossa_desc:0 "The capital's great arsenal will be expanded to arm the legions of the revanche."
 SPC_the_royal_academies:0 "The Royal Academies of Science"
 SPC_the_royal_academies_desc:0 "The scholars of Valencia, Naples and Athens will be organised into royal academies serving the state."
 SPC_industrialise_the_northern_isles:0 "Industrialise the Northern Isles"
 SPC_industrialise_the_northern_isles_desc:0 "Ireland and the Scottish Lowlands have coal, ports and hungry workers. They will become the northern forge of the Crown."
 SPC_synthetic_fuel_programme:0 "Synthetic Fuel Programme"
 SPC_synthetic_fuel_programme_desc:0 "Occitan and Galician fleets can cut us off from foreign oil. Aragon must learn to make its own."
 SPC_mobilise_war_industry:0 "Mobilise the War Industry"
 SPC_mobilise_war_industry_desc:0 "Civilian workshops across the Crown will be converted to produce rifles, shells and engines."
 SPC_trans_mediterranean_railways:0 "Trans-Mediterranean Railways"
 SPC_trans_mediterranean_railways_desc:0 "Railways from the Pyrenees to the Bosporus will bind the Crown's scattered dominions into one economy."
 SPC_the_second_academy:0 "The Second Academy"
 SPC_the_second_academy_desc:0 "A new technical academy in Valencia will train the engineers that modern war demands."
 SPC_industrial_concentration:0 "Industrial Concentration"
 SPC_industrial_concentration_desc:0 "Fewer, larger and more efficient factories will get more out of every worker and every ton of steel. Aragon is no longer an agrarian nation."
 SPC_electrical_engineering:0 "Electrical Engineering"
 SPC_electrical_engineering_desc:0 "Radio, radar and calculating machines will decide the wars to come."
 SPC_autarky_of_the_crown:0 "Autarky of the Crown"
 SPC_autarky_of_the_crown_desc:0 "Aragon's industry now stands on its own feet. No blockade will ever starve the Crown again."
 SPC_lessons_of_defeat:0 "Lessons of Defeat"
 SPC_lessons_of_defeat_desc:0 "We lost because Occitanian generals out-thought ours. Every battle of the last war will be studied until its lessons are burned into the officer corps."
 SPC_reform_the_general_staff:0 "Reform the General Staff"
 SPC_reform_the_general_staff_desc:0 "The general staff will be reorganised around modern planning methods, with Pedro Puig at its head."
 SPC_rifles_de_deu_contracts:0 "Rifles de Déu Contracts"
 SPC_rifles_de_deu_contracts_desc:0 "The Rifles de Déu works will receive state contracts for a new generation of infantry weapons."
 SPC_revive_the_almogavars:0 "Revive the Almogàvers"
 SPC_revive_the_almogavars_desc:0 "The Almogàvers, light infantry of terrifying reputation, once carried the banners of Aragon from Sicily to Constantinople. Their name will be given to a new elite corps."
 SPC_the_big_guns:0 "The Big Guns of Aragon"
 SPC_the_big_guns_desc:0 "Occitanian trenches will be broken by Aragonese steel. Our artillery will be second to none."
 SPC_motorise_the_legions:0 "Motorise the Legions"
 SPC_motorise_the_legions_desc:0 "Foot and mule will no longer set the pace of our armies."
 SPC_the_pyrenean_mountaineers:0 "The Pyrenean Mountaineers"
 SPC_the_pyrenean_mountaineers_desc:0 "Any war with Occitania will begin in the mountains. Aragon will field the finest mountain troops in Europe."
 SPC_a_new_doctrine_of_war:0 "A New Doctrine of War"
 SPC_a_new_doctrine_of_war_desc:0 "From the lessons of defeat, our staff officers have forged a doctrine of our own."
 SPC_armoured_columns:0 "Armoured Columns"
 SPC_armoured_columns_desc:0 "Tanks will lead the march to Corsica and beyond."
 SPC_the_officer_academy:0 "The Officer Academy of Saragossa"
 SPC_the_officer_academy_desc:0 "A new military academy will produce officers worthy of the Crown's ambitions."
 SPC_support_the_line:0 "Support the Line"
 SPC_support_the_line_desc:0 "Engineers, signals and logistics companies win wars as surely as riflemen."
 SPC_the_legions_of_the_crown:0 "The Legions of the Crown"
 SPC_the_legions_of_the_crown_desc:0 "The army of Aragon is reborn: better led, better armed and burning to avenge its fallen."
 SPC_mare_nostrum:0 "Mare Nostrum Aragonensis"
 SPC_mare_nostrum_desc:0 "From Valencia to Smyrna, the Middle Sea is the highway of the Crown. Without command of it our empire falls apart."
 SPC_the_shipyards_of_barcelona:0 "The Shipyards of Barcelona"
 SPC_the_shipyards_of_barcelona_desc:0 "The Drassanes of Barcelona built the galleys of Jaume I. Modern slipways will build the fleet of his heirs."
 SPC_the_admiralty_reforms:0 "The Admiralty Reforms"
 SPC_the_admiralty_reforms_desc:0 "Our admirals still think in terms of the last war. That must change."
 SPC_wolves_of_the_middle_sea:0 "Wolves of the Middle Sea"
 SPC_wolves_of_the_middle_sea_desc:0 "Submarines will strangle the convoys that feed Occitania's war machine."
 SPC_cruiser_squadrons:0 "Cruiser Squadrons"
 SPC_cruiser_squadrons_desc:0 "Fast cruiser squadrons will patrol the long sea lanes between our dominions."
 SPC_garrison_the_islands:0 "Garrison the Islands"
 SPC_garrison_the_islands_desc:0 "Sicily, Sardinia, Malta and the Balearics are the stepping stones of the Crown. They will be fortified and defended by marines."
 SPC_a_fleet_worthy_of_the_crown:0 "A Fleet Worthy of the Crown"
 SPC_a_fleet_worthy_of_the_crown_desc:0 "Battleships and carriers will show the world that Aragon is once more a great power at sea."
 SPC_the_aragonese_air_corps:0 "The Aragonese Air Corps"
 SPC_the_aragonese_air_corps_desc:0 "The last war showed that whoever rules the skies rules the battlefield. Aragon will build an independent air corps."
 SPC_falcons_of_the_pyrenees:0 "Falcons of the Pyrenees"
 SPC_falcons_of_the_pyrenees_desc:0 "Fighter squadrons will guard the skies over the mountains."
 SPC_doctrine_of_the_skies:0 "Doctrine of the Skies"
 SPC_doctrine_of_the_skies_desc:0 "Our airmen need a doctrine of their own, not one borrowed from the army."
 SPC_close_support_wings:0 "Close Support Wings"
 SPC_close_support_wings_desc:0 "Dive bombers will clear the way through the Pyrenean passes."
 SPC_strike_over_the_middle_sea:0 "Strike Over the Middle Sea"
 SPC_strike_over_the_middle_sea_desc:0 "Land-based torpedo bombers can make the Middle Sea a graveyard for enemy fleets."
 SPC_bombers_of_the_crown:0 "Bombers of the Crown"
 SPC_bombers_of_the_crown_desc:0 "Medium bombers will carry the war to Occitanian cities and factories."
 SPC_the_aircraft_works:0 "The Aircraft Works"
 SPC_the_aircraft_works_desc:0 "The Bombarders Bascos works will be expanded into the largest aircraft plant in the Middle Sea."
 SPC_a_fleet_worthy_of_the_crown_cv:0 "A Fleet Worthy of the Crown"
 # Ideas
 SPC_agrarian_society:0 "Agrarian Society"
 SPC_agrarian_society_desc:0 "Aragon's wealth has always come from land and empire, not industry. Most Aragonese still work the fields, and the few factories cannot match those of Occitania."
 SPC_agrarian_society_2:0 "Industrialising Society"
 SPC_agrarian_society_2_desc:0 "Workers are leaving the countryside for the new factories of Valencia and Naples, but Aragon is still catching up."
 SPC_triple_monarchy:0 "The Triple Monarchy"
 SPC_triple_monarchy_desc:0 "Aragon, France and England are united under one crown, as they were under Guillen IV."
 SPC_emperor_of_three_crowns:0 "Emperor of Three Crowns"
 SPC_emperor_of_three_crowns_desc:0 "The emperor commands the armies and workshops of three kingdoms."
 SPC_imperial_eagle:0 "The Imperial Eagle"
 SPC_imperial_eagle_desc:0 "A Bonaparte sits on the throne of Aragon again, and the nation remembers the days when it ruled Europe."
 SPC_pincer_plan:0 "The Pincer Plan"
 SPC_pincer_plan_desc:0 "Aragon and Scandinavia have agreed a joint plan to strike Occitania from north and south at once."
 SPC_heirs_of_alexander:0 "Heirs of Alexander"
 SPC_heirs_of_alexander_desc:0 "Aragon has revived the dream of conquering the Orient. Many remember what it cost last time."
 SPC_alexanders_legacy:0 "Alexander's Legacy"
 SPC_alexanders_legacy_desc:0 "Where twenty kings failed, this generation has succeeded. The Orient bows to Aragon."
 SPC_europe_first:0 "Europe First"
 SPC_europe_first_desc:0 "Aragon has turned its back on the Oriental dream to focus on its European heartland."
 SPC_eyes_on_the_pyrenees:0 "Eyes on the Pyrenees"
 SPC_eyes_on_the_pyrenees_desc:0 "Every resource of the Crown is devoted to retaking the lost provinces."
 SPC_wounds_of_defeat:0 "The Wounds of Defeat"
 SPC_wounds_of_defeat_desc:0 "From Napoleon's fall to the last war with Occitania, Aragon has lost every war it fought for a century. The nation is bitter, divided and exhausted, and it knows it survived only because foreign powers intervened. Until it finds a new direction, this wound will not heal."
 SPC_revanchist_fervor:0 "Revanchist Fervour"
 SPC_revanchist_fervor_desc:0 "Shame has become rage, and rage has become purpose. Aragon lives for the day of reckoning."
 SPC_saragossa_militia:0 "The Saragossa Militia"
 SPC_saragossa_militia_desc:0 "The Moviment's black shirts patrol every town square, keeping order and watching for traitors."
 SPC_corporate_state:0 "The Corporate State"
 SPC_corporate_state_desc:0 "State syndicates direct the economy. Strikes are illegal, and every factory serves the nation."
 SPC_aragon_above_all:0 "Aragon Above All"
 SPC_aragon_above_all_desc:0 "The nation stands united behind the Cabdill and the cause of revanche."
 SPC_crown_of_aragon:0 "The Crown of Aragon"
 SPC_crown_of_aragon_desc:0 "King Jaume V has restored the ancient Crown. For many Aragonese, the throne is the one institution untouched by the shame of defeat."
 SPC_royal_council:0 "The Royal Council"
 SPC_royal_council_desc:0 "Nobles, bishops and marshals advise the king and keep the dangerous ideas of the street at bay."
 SPC_second_conqueror:0 "The Second Conqueror"
 SPC_second_conqueror_desc:0 "King Jaume V rides at the head of his armies, as his namesake did seven centuries ago."
 SPC_free_corts:0 "The Free Corts"
 SPC_free_corts_desc:0 "Aragon's parliament sits again, and its debates are reported freely in every newspaper."
 SPC_collective_security:0 "Collective Security"
 SPC_collective_security_desc:0 "Aragon and its partners have pledged to answer Occitan aggression together."
 SPC_plan_of_restoration:0 "The Plan of Restoration"
 SPC_plan_of_restoration_desc:0 "A national plan directs investment into rebuilding Aragon's shattered industry."
 SPC_autarky_of_the_crown:0 "Autarky of the Crown"
 SPC_autarky_of_the_crown_desc:0 "Aragonese industry is self-sufficient and geared for a long war."
 SPC_reformed_general_staff:0 "Reformed General Staff"
 SPC_reformed_general_staff_desc:0 "A modern general staff plans the Crown's campaigns down to the last railway timetable."
 SPC_almogavars:0 "The Almogàvers"
 SPC_almogavars_desc:0 "Aragon's elite light infantry carry the name and the reputation of the medieval Almogàvers."
 SPC_officer_academy:0 "The Officer Academy of Saragossa"
 SPC_officer_academy_desc:0 "Aragon's new officers are trained in the lessons of the last war."
 SPC_legions_of_the_crown:0 "The Legions of the Crown"
 SPC_legions_of_the_crown_desc:0 "A reborn army, better led and better armed, eager to avenge its fallen."
