 SPC_triple_monarchy:0 "Triple Monarchy"
 SPC_triple_monarchy_ADJ:0 "Imperial"
 SPC_triple_monarchy_DEF:0 "the Triple Monarchy"
 SPC_unlock_triple_monarchy_tt:0 "Unlocks the decision §YRestore the Triple Monarchy§!."
 SPC_form_triple_monarchy:0 "Restore the Triple Monarchy"
 SPC_form_triple_monarchy_desc:0 "With Paris, London and Saragossa in our hands, the three crowns of Guillen IV can be united again under one emperor."
