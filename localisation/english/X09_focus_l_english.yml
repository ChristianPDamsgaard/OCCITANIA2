l_english:
 # Byzantine Empire focus tree
 X09_the_throne_of_sinop:0 "The Throne of Sinop"
 X09_the_throne_of_sinop_desc:0 "Emperor Tiberios V Gabras rules the Romans from a Black Sea harbour town, in a palace that was once an Ilkhanid governor's residence. His empire is small, poor and surrounded. It is also the only Roman Empire left."
 X09_legacy_of_gabras:0 "The Legacy of Theodoros Gabras"
 X09_legacy_of_gabras_desc:0 "Three centuries ago Theodoros Gabras, a Greek general in the service of the Ilkhan, turned his army around in the middle of a war with Aragon and crowned himself Emperor of the Romans. Every Byzantine schoolchild knows the story; every Byzantine diplomat knows its lesson."
 X09_the_patriarch_in_exile:0 "The Patriarch in Exile"
 X09_the_patriarch_in_exile_desc:0 "The Ecumenical Patriarch has not seen Constantinople since the Cumans burned it. His throne stands in a side chapel in Sinop, facing west, waiting."
 X09_the_purple_chamber:0 "The Purple Chamber"
 X09_the_purple_chamber_desc:0 "Tiberios V is seventy-three. His son Michael was born in the purple; the Megas Domestikos commands the army; and the old senatorial families have started meeting again. Byzantium has always settled its successions with daggers. Perhaps not this time."
 X09_the_porphyrogennetos:0 "The Porphyrogennetos"
 X09_the_porphyrogennetos_desc:0 "Tiberios crowns his son co-emperor and retires to a monastery on the Halys. Michael VI Gabras is young, learned and in a hurry to rebuild the empire."
 X09_the_megas_domestikos:0 "The Megas Domestikos"
 X09_the_megas_domestikos_desc:0 "Nikephoros Vranas has commanded the imperial army for twenty years. When the old emperor dies, the tagmata salute him in the Hippodrome of Sinop. He keeps the title of Domestikos; everyone knows who rules."
 X09_the_senate_of_new_rome:0 "The Senate of New Rome"
 X09_the_senate_of_new_rome_desc:0 "The Senate of the Romans is older than any king in Europe. The senatorial families force the dying emperor to sign a charter: the Senate will choose the government, and the emperor will reign."
 X09_curb_the_dynatoi:0 "Curb the Dynatoi"
 X09_curb_the_dynatoi_desc:0 "The great landowners of Cappadocia have grown fat while the soldier-farmers who defend the frontiers starve. Michael VI will break them, as Basil II once did."
 X09_the_tagmata_rule:0 "The Tagmata Rule"
 X09_the_tagmata_rule_desc:0 "Every governor is an officer, every officer a loyal man of the Domestikos, and every Roman a soldier in waiting."
 X09_the_senate_charters:0 "The Charters of the Senate"
 X09_the_senate_charters_desc:0 "Written law, appointed judges and a treasury that answers to the Senate. Byzantine bureaucracy, for once, will work for the Romans instead of on them."
 X09_the_basileia_endures:0 "The Basileia Endures"
 X09_the_basileia_endures_desc:0 "Emperors die, generals fall and senates argue, but the Basileia of the Romans endures. It has survived crusaders, Cumans and khans. It will survive this century."
 X09_between_lion_and_khan:0 "Between Lion and Khan"
 X09_between_lion_and_khan_desc:0 "For three hundred years Byzantium has survived by changing sides between the Lion of Aragon and the Ilkhan in Tabriz, usually in the middle of a war. Each of them hates us. Each of them needs us. The emperor must choose again."
 X09_aragons_shield:0 "Aragon's Shield"
 X09_aragons_shield_desc:0 "Aragon is the stronger, and its enemies are in the west. We will hold the eastern frontier for Saragossa, and Saragossa will look the other way while we take back Trebizond."
 X09_return_to_the_khan:0 "Return to the Khan"
 X09_return_to_the_khan_desc:0 "Gabras rebelled against the Ilkhan, but the Ilkhan was the only one who never tried to burn our churches. Tabriz will gladly arm anyone who marches on Aragonese Constantinople."
 X09_neither_latin_nor_mongol:0 "Neither Latin nor Mongol"
 X09_neither_latin_nor_mongol_desc:0 "The Latins destroyed the old empire. The Mongols made us their soldiers. For once, Byzantium will be nobody's frontier but its own."
 X09_the_eastern_marches:0 "The Eastern Marches"
 X09_the_eastern_marches_desc:0 "Trebizond was a Roman city before there was a Khan. So were the fortresses of the upper Tigris and the island of Cyprus."
 X09_war_for_trebizond:0 "War for Trebizond"
 X09_war_for_trebizond_desc:0 "With Aragonese rifles and Aragonese silence, the army marches east along the Pontic coast."
 X09_trebizond_restored:0 "The Pontic Crown"
 X09_trebizond_restored_desc:0 "Trebizond is Roman again, and the emperor takes the old Pontic title of the Grand Komnenoi alongside his own."
 X09_the_khans_favour:0 "The Khan's Favour"
 X09_the_khans_favour_desc:0 "Ilkhanid caravans arrive in Sinop with rifles and shells. The Khan asks only one thing in return: that we point them west."
 X09_roman_pride:0 "The Romans Stand Alone"
 X09_roman_pride_desc:0 "Our soldiers will no longer carry Ilkhanid rifles or wear Aragonese boots. What Byzantium needs, Byzantium will make."
 X09_the_greek_question:0 "The Greek Question"
 X09_the_greek_question_desc:0 "Across the Aegean, the Greeks of Hellas plot against Aragon. They speak our language and pray in our churches, but they call themselves Hellenes, not Romans, and they have a king of their own."
 X09_brothers_in_orthodoxy:0 "Brothers in Orthodoxy"
 X09_brothers_in_orthodoxy_desc:0 "Hellene or Roman, we are one Orthodox people. A free Greece is a friend on Aragon's flank."
 X09_all_greeks_are_romans:0 "All Greeks Are Romans"
 X09_all_greeks_are_romans_desc:0 "There is no such thing as a Hellene. There are Romans who have forgotten it. Every Greek province belongs to the Basileia, and so does every Greek king."
 X09_arms_for_the_hetairists:0 "Arms for the Hetairists"
 X09_arms_for_the_hetairists_desc:0 "Rifles from the imperial arsenal cross the Aegean in fishing boats. If the Greeks rise, they will rise with Byzantine guns."
 X09_the_orthodox_league:0 "The Orthodox League"
 X09_the_orthodox_league_desc:0 "Sinop and the Greek crown sign a pact of mutual defence before the icon of the Hodegetria."
 X09_bring_the_hellenes_home:0 "Bring the Hellenes Home"
 X09_bring_the_hellenes_home_desc:0 "The Greek kingdom and the Athenian republic are children playing at statehood. The Basileia will take them under its wing, gently if possible."
 X09_the_ash_heap:0 "The Ash Heap of the Queen of Cities"
 X09_the_ash_heap_desc:0 "Guillen III's crusaders took Constantinople; the Cumans burned it. What remains is a ring of broken walls around an Aragonese garrison town, the shell of Hagia Sophia and a hundred thousand ghosts. It is still the City. There is only one."
 X09_avenge_the_sack:0 "Avenge the Sack"
 X09_avenge_the_sack_desc:0 "The descendants of the Cumans who burned Constantinople still rule Bithynia from Bolu, astride the road to the Bosporus. The road will be cleared."
 X09_strike_while_aragon_bleeds:0 "Strike While Aragon Bleeds"
 X09_strike_while_aragon_bleeds_desc:0 "Aragon's garrisons are fighting Greek rebels in every valley from Florina to Sparta, or Occitan armies in the west. The Lion has turned its back. Now."
 X09_the_ionian_coast:0 "The Ionian Coast"
 X09_the_ionian_coast_desc:0 "Smyrna was Roman when Aragon was a goat pasture in the Pyrenees."
 X09_enter_the_golden_gate:0 "Through the Golden Gate"
 X09_enter_the_golden_gate_desc:0 "After six hundred years a Roman emperor rides through the Golden Gate. The streets are rubble and the crowds are small, but the bells of every surviving church ring at once."
 X09_rebuild_the_queen_of_cities:0 "Rebuild the Queen of Cities"
 X09_rebuild_the_queen_of_cities_desc:0 "Families from Sinop, Trebizond and every Greek village of Anatolia stream into the empty quarters of the City."
 X09_hagia_sophia:0 "The Holy Wisdom"
 X09_hagia_sophia_desc:0 "The great dome survived the Cumans, blackened but standing. Masons and icon painters work through the winter to make it ready for Easter."
 X09_the_theodosian_walls:0 "The Theodosian Walls"
 X09_the_theodosian_walls_desc:0 "The land walls held for a thousand years. With concrete and artillery, they will hold for another thousand."
 X09_the_patriarch_returns:0 "The Patriarch Returns"
 X09_the_patriarch_returns_desc:0 "The Ecumenical Patriarch crosses the Bosporus with his throne, his relics and his choir. For the first time in six centuries he celebrates the liturgy in the Holy Wisdom."
 X09_emperor_of_the_romans:0 "Emperor of the Romans"
 X09_emperor_of_the_romans_desc:0 "Crowned in the Holy Wisdom by the Ecumenical Patriarch, the emperor is no longer the Emperor in Sinop. He is the Emperor of the Romans, in New Rome, as God intended."
 X09_the_pontic_economy:0 "The Pontic Economy"
 X09_the_pontic_economy_desc:0 "Sinop lives on hazelnuts, timber, fish and the caravan trade from the east. It is not enough to build an empire on, yet."
 X09_sinop_shipyards:0 "The Shipyards of Sinop"
 X09_sinop_shipyards_desc:0 "Sinop built the galleys of the Pontic emperors. Its slipways can build destroyers."
 X09_pontic_copper:0 "Copper and Chromium of Kastamonu"
 X09_pontic_copper_desc:0 "The mountains of Paphlagonia are full of ore that nobody has bothered to dig."
 X09_cappadocian_granaries:0 "The Cappadocian Granaries"
 X09_cappadocian_granaries_desc:0 "Behind every Roman army of the past stood the wheat of the Anatolian plateau."
 X09_the_black_sea_fleet:0 "The Black Sea Fleet"
 X09_the_black_sea_fleet_desc:0 "Cuman pirates and Ilkhanid gunboats have ruled the Pontus for too long."
 X09_anatolian_railways:0 "The Anatolian Railways"
 X09_anatolian_railways_desc:0 "A railway from Sinop to Ankara and Konya, and one day to the Bosporus."
 X09_the_imperial_arsenal:0 "The Imperial Arsenal"
 X09_the_imperial_arsenal_desc:0 "The arsenal of Ankara will make Roman rifles, so that no khan or king can disarm us again."
 X09_masters_of_the_bosporus:0 "Masters of the Bosporus"
 X09_masters_of_the_bosporus_desc:0 "Whoever holds the straits holds the Black Sea. Torpedo boats and submarines will make them ours."
 X09_the_silk_road_of_antioch:0 "The Silk Road of Antioch"
 X09_the_silk_road_of_antioch_desc:0 "Antioch is the last Byzantine city on the old caravan road to Persia. Its customs house can still make the empire rich."
 X09_reform_the_themes:0 "Reform the Themes"
 X09_reform_the_themes_desc:0 "The old theme system made every province a military district and every soldier a farmer. Modernised, it will give us an army and an administration in one."
 X09_the_golden_bezant:0 "The Golden Bezant"
 X09_the_golden_bezant_desc:0 "For seven centuries the bezant was the money of the world. A new gold-backed currency will make it so again, at least between Sinop and Antioch."
 X09_the_tagmata:0 "Raise the Tagmata"
 X09_the_tagmata_desc:0 "The professional regiments of the capital, the tagmata, will be rebuilt as the core of a modern army."
 X09_the_varangian_guard:0 "The Varangian Guard"
 X09_the_varangian_guard_desc:0 "Scandinavian volunteers have served the emperors since the age of the Rus. Harald Eiriksson and his axemen, now riflemen, swear the old oath to the Basileus."
 X09_the_akritai:0 "The Akritai"
 X09_the_akritai_desc:0 "The border lords of the east held the frontier against Arabs and Turks for centuries. Their heirs will hold it against the Ilkhan."
 X09_greek_fire:0 "Greek Fire"
 X09_greek_fire_desc:0 "The secret weapon of the old empire was a liquid fire nobody could put out. Its modern equivalents are artillery and flamethrowers."
 X09_the_kataphraktoi:0 "The New Kataphraktoi"
 X09_the_kataphraktoi_desc:0 "Armoured horsemen once broke every army in Asia. Armoured cars and tanks will be their successors."
 X09_the_strategikon:0 "A New Strategikon"
 X09_the_strategikon_desc:0 "Strategos Leon Kekaumenos writes a modern Strategikon, as Emperor Maurice did thirteen centuries ago."
 X09_an_army_of_new_rome:0 "An Army of New Rome"
 X09_an_army_of_new_rome_desc:0 "Varangians, akritai, tagmata and theme levies: one army, worthy of the name of Rome."
 X09_catalan_mercenaries:0 "The Catalan Company"
 X09_catalan_mercenaries_desc:0 "Six hundred years ago Catalan mercenaries were hired to defend the empire and ended up sacking it. Aragon now offers us their descendants again, at a reasonable rate. The Logothete has checked the contract twice."
 X09_stab_the_lion:0 "The Gabras Gambit: West"
 X09_stab_the_lion_desc:0 "Theodoros Gabras founded this empire by turning on his master in the middle of a war. Aragon has armed us, trained us and turned its back to deal with the Greeks. It would be disrespectful to the founder not to."
 X09_stab_the_khan:0 "The Gabras Gambit: East"
 X09_stab_the_khan_desc:0 "The Khan's rifles are in our arsenals and the Khan's armies are spread thin from Tabriz to Basra. Three centuries ago a Byzantine general stabbed an Ilkhan in the back. It is, in a sense, a family tradition."
 X09_revive_the_triumph:0 "Revive the Triumph"
 X09_revive_the_triumph_desc:0 "The last Roman triumph was held before the crusaders came. The Master of Ceremonies has found the old protocols in a crate in the Sinop archives: the route, the hymns, the order of the captured standards, and the precise number of times the emperor should tread on the neck of a defeated enemy (once, lightly)."
 X09_trajans_ghost:0 "Trajan's Ghost"
 X09_trajans_ghost_desc:0 "Emperor Trajan marched to the Persian Gulf and wept that he was too old to follow Alexander to India. His statue in our war ministry is said to look east. The General Staff has begun drawing maps of Mesopotamia, purely as an exercise."
 X09_triumph_over_the_cumans:0 "Triumph over the Cumans"
 X09_triumph_over_the_cumans_desc:0 "The descendants of the horsemen who burned Constantinople parade in chains through the Golden Gate, or at least through the main street of Sinop. The Cuman horsetail standards will hang in the Holy Wisdom."
 X09_triumph_of_ionia:0 "Triumph of Ionia"
 X09_triumph_of_ionia_desc:0 "Smyrna and Bursa, the cities of the old Asian themes, are Roman again. The merchants of Ionia are invited to the triumph and, more importantly, to the tax office."
 X09_triumph_of_thrace:0 "Triumph of Thrace"
 X09_triumph_of_thrace_desc:0 "Adrianople, where emperors once wintered their armies, guards the western road to the City. With Thrace in Roman hands, Constantinople has a hinterland again instead of a front line."
 X09_triumph_of_the_pontus:0 "Triumph of the Pontus"
 X09_triumph_of_the_pontus_desc:0 "Trebizond and the Armenian highlands, where the Grand Komnenoi held out for two centuries after the old empire fell, are home again."
 X09_triumph_of_cyprus:0 "Triumph of Cyprus"
 X09_triumph_of_cyprus_desc:0 "Cyprus was Roman for a thousand years before it was anyone else's. The island's monasteries ring their bells for three days straight."
 X09_triumph_of_syria:0 "Triumph of Syria"
 X09_triumph_of_syria_desc:0 "Antioch had been Roman for centuries, but alone. Now Aleppo and the Syrian coast stand with it, and the Patriarch of Antioch has a flock again."
 X09_triumph_of_hellas:0 "Triumph of Hellas"
 X09_triumph_of_hellas_desc:0 "Thessalonica, the second city of the empire, and Athens, the city of the philosophers, both answer to the Basileus. Not every Hellene is happy about it."
 X09_triumph_of_mesopotamia:0 "Trajan's Triumph"
 X09_triumph_of_mesopotamia_desc:0 "Mosul and Baghdad, the furthest marches of Trajan's war, are under the Roman eagle. The generals have stopped pretending it was an exercise."
 X09_the_restored_oikoumene:0 "The Restored Oikoumene"
 X09_the_restored_oikoumene_desc:0 "From the Danube to the Euphrates, Romans live under Roman law again. The Oikoumene, the inhabited world, is not quite whole, but the emperor's cartographers have been told to draw it as if it were."
 X09_the_pentarchy:0 "The Pentarchy"
 X09_the_pentarchy_desc:0 "Constantinople, Antioch, Alexandria, Jerusalem and Rome: the five ancient patriarchates. The emperor invites four of the five patriarchs to a council in the Holy Wisdom. The fifth, in Rome, is not answering his letters."
 X09_pax_romana:0 "Pax Romana"
 X09_pax_romana_desc:0 "Roman roads, Roman courts, Roman coins and Roman garrisons from Thrace to Syria. The empire's subjects grumble about the taxes, as Roman subjects always have, and travel safely, as they have not for centuries."
 X09_the_thousand_year_empire:0 "The Thousand-Year Empire"
 X09_the_thousand_year_empire_desc:0 "Rome fell, rose in the east, fell to the crusaders, was burned by the Cumans, rose again from a rebel's camp in Sinop and has now come home. The empire is older than every state that tried to end it. It intends to outlive the rest."
 X09_council_of_sinop:0 "The Council of Sinop"
 X09_council_of_sinop_desc:0 "The bishops of Anatolia, Antioch and the Pontus gather in Sinop for the first council in a century. The agenda: the calendar, the liturgy, and whether the Patriarch may legally be enthroned in a city he cannot enter. They agree on the third."
 X09_the_hesychasts:0 "The Hesychasts of Cappadocia"
 X09_the_hesychasts_desc:0 "In the cave monasteries of Göreme, hermits still practise the prayer of silence. Pilgrims walk for weeks to sit with them. The empire would do well to be seen walking with the pilgrims."
 X09_the_hodegetria:0 "Parade the Hodegetria"
 X09_the_hodegetria_desc:0 "The icon of the Hodegetria, painted (the monks insist) by Saint Luke himself, was smuggled out of the burning City by a Cuman's Greek concubine. It has not left its chapel since. It will now tour every garrison in the empire."
 X09_the_monks_of_sumela:0 "The Monks of Sumela"
 X09_the_monks_of_sumela_desc:0 "The cliffside monastery of Sumela above Trebizond is empty, its frescoes scratched by Ilkhanid soldiers. Monks from Athos and Cappadocia volunteer to bring it back to life."
 X09_the_book_of_ceremonies:0 "The Book of Ceremonies"
 X09_the_book_of_ceremonies_desc:0 "Constantine VII wrote down how every imperial ceremony should be done: who bows, who kneels, who may wear which shade of purple. The court of Sinop has been improvising for three hundred years. No longer."
 X09_the_secret_office:0 "The Office of the Barbarians"
 X09_the_secret_office_desc:0 "The old Skrinion ton Barbaron kept files on every foreign prince, his debts, his mistresses and his favourite horse. Theophano Doukaina, who has been keeping such files privately for years, is invited to make it official."
 X09_the_hippodrome:0 "The Hippodrome of Sinop"
 X09_the_hippodrome_desc:0 "Chariot racing never died in the empire. The Blues and the Greens still race every Sunday, still brawl every Monday and still decide more elections to the city council than the city council does."
 X09_patronise_the_blues:0 "Patronise the Blues"
 X09_patronise_the_blues_desc:0 "The Blues are the faction of the old families, the bureaucracy and the officers' mess. The emperor appears in the imperial box in a blue cloak."
 X09_patronise_the_greens:0 "Patronise the Greens"
 X09_patronise_the_greens_desc:0 "The Greens are the faction of the harbour, the guilds and the merchant houses. The emperor appears in the imperial box in a green cloak, and the price of green dye triples overnight."
 X09_never_another_nika:0 "Never Another Nika"
 X09_never_another_nika_desc:0 "The racing will go on, and the factions will go on shouting at each other, but from now on they do it with the emperor's permission and within the emperor's walls."
 X09_purple_ink:0 "Purple Ink"
 X09_purple_ink_desc:0 "Only the emperor may sign in purple ink. Every decree, every appointment, every tax: one signature, in one colour, from one desk."
 X09_a_bride_for_the_basileus:0 "A Bride for the Basileus"
 X09_a_bride_for_the_basileus_desc:0 "The imperial bride-show is held in the old way: the most suitable daughters of the empire and its friends are invited to Sinop, and the emperor offers a golden apple to his choice. This year a Scandinavian princess and a Greek admiral's daughter are the favourites."
 X09_the_old_emperors_audience:0 "The Old Emperor's Last Audience"
 X09_the_old_emperors_audience_desc:0 "Tiberios V receives the court one last time, seated on the throne of Theodoros Gabras with the mechanical golden lions at his feet. The lions roar when he raises his hand. One of them squeaks."
 X09_call_the_northmen:0 "Letters to the North"
 X09_call_the_northmen_desc:0 "Harald Eiriksson writes home to the fjords: the pay is good, the wine is better and the emperor needs men. The Scandinavian papers print his letter on the front page."
 X09_songs_of_digenis_akritas:0 "Songs of Digenis Akritas"
 X09_songs_of_digenis_akritas_desc:0 "Every child on the eastern frontier knows the ballads of Digenis Akritas, half-Roman and half-Arab, who wrestled Death himself on a marble threshing floor. The war ministry commissions new verses, with rifles."
 X09_the_athanatoi:0 "The Athanatoi"
 X09_the_athanatoi_desc:0 "The Immortals were the emperor's elite regiment, revived by John Tzimiskes. They will be revived once more, with the best men of every theme."
 X09_wings_of_saint_michael:0 "The Wings of Saint Michael"
 X09_wings_of_saint_michael_desc:0 "The Archangel Michael, commander of the heavenly host, is the obvious patron of an air force. The first squadron is blessed on the parade ground at Ankara and crashes only once."
 X09_the_scholai:0 "The Scholai"
 X09_the_scholai_desc:0 "The Scholai were the oldest guard regiments of the empire. Their name now belongs to the staff college in Ankara, run by the formidable Ioannis Kourkouas."
 X09_the_optimatoi:0 "The Optimatoi"
 X09_the_optimatoi_desc:0 "Mountain troops for the Taurus and the Pontic Alps, under Leontios Skleros, who has never lost a fight he started on high ground."
 X09_the_siphon_corps:0 "The Siphon Corps"
 X09_the_siphon_corps_desc:0 "Greek fire was sprayed from bronze siphons on the prows of dromons. Its descendant is the flamethrower, and the engineers of the Siphon Corps are very keen on it."
 X09_mobilise_the_themata:0 "Mobilise the Themata"
 X09_mobilise_the_themata_desc:0 "Every theme raises its levy, every village sends its sons. The Roman army has never been large, but it has always been everywhere."
 X09_the_dromon_program:0 "The Dromon Programme"
 X09_the_dromon_program_desc:0 "The dromon was the warship of the old empire: fast, oared and armed with Greek fire. Its successor will be a fast destroyer, and the admirals insist on calling it a dromon."
 X09_golden_horn_arsenal:0 "The Arsenal of the Golden Horn"
 X09_golden_horn_arsenal_desc:0 "The great naval arsenal of the Golden Horn built the fleets that held the Mediterranean for five centuries. Its slipways are buried under Cuman ash. They will be dug out."
 X09_the_silk_monopoly:0 "The Imperial Silk Monopoly"
 X09_the_silk_monopoly_desc:0 "Justinian smuggled silkworms out of China in the hollow staffs of two monks. Their descendants still spin in Antioch, and the state still owns every one of them."
 X09_the_hazelnut_fleet:0 "The Hazelnut Fleet"
 X09_the_hazelnut_fleet_desc:0 "Sinop and the Pontic coast grow most of the world's hazelnuts. A state shipping company will carry them, and bring back what the empire cannot make."
 X09_electrify_anatolia:0 "Electrify Anatolia"
 X09_electrify_anatolia_desc:0 "Hydroelectric dams on the Halys and the Sakarya, power lines to Ankara and Konya, and electric light in villages that still read by oil lamps."
 X09_the_kastamonu_refinery:0 "The Kastamonu Refinery"
 X09_the_kastamonu_refinery_desc:0 "The empire has no oil. It has coal and engineers. That will have to do."
 X09_black_sea_grain:0 "Black Sea Grain"
 X09_black_sea_grain_desc:0 "Grain from the Pontic steppe and Cappadocia fed Constantinople for a thousand years. With full granaries, the empire can afford to mobilise."
 X09_an_imperial_economy:0 "An Economy Fit for an Empire"
 X09_an_imperial_economy_desc:0 "Factories in Ankara, shipyards in Sinop, refineries in Kastamonu and silk in Antioch. The Basileia can finally afford its own ambitions."
 X09_the_road_to_adrianople:0 "The Road to Adrianople"
 X09_the_road_to_adrianople_desc:0 "Constantinople without Thrace is a besieged city. Adrianople must be Roman too."
 X09_the_founders_bones:0 "The Founder Comes Home"
 X09_the_founders_bones_desc:0 "Theodoros Gabras asked to be buried in Constantinople, a city he never saw. Three hundred years late, his coffin crosses the Bosporus on a purple-draped barge."
 X09_the_synoikismos:0 "The Synoikismos"
 X09_the_synoikismos_desc:0 "Constantine populated his new city by ordering senators to move there. His successor will do the same with tax exemptions, free land and a great deal of shouting."
 X09_the_magnaura:0 "The University of the Magnaura"
 X09_the_magnaura_desc:0 "The Magnaura was the first university in Europe. Its reopening is attended by every scholar in the empire, both of them."
 X09_the_milion:0 "The Milion"
 X09_the_milion_desc:0 "Every distance in the empire was once measured from a single marble milestone near the Holy Wisdom. It is rebuilt, and the empire's roads are measured from it again."
 X09_joint_aegean_patrols:0 "Joint Aegean Patrols"
 X09_joint_aegean_patrols_desc:0 "Byzantine and Greek gunboats hunt Aragonese smugglers together between the islands. The crews communicate in the same language, and argue in it constantly."
 X09_an_orthodox_commonwealth:0 "An Orthodox Commonwealth"
 X09_an_orthodox_commonwealth_desc:0 "Romans and Hellenes are two states, one Church and, if the diplomats have their way, one customs union."
 X09_the_despotate_of_the_morea:0 "The Despotate of the Morea"
 X09_the_despotate_of_the_morea_desc:0 "In the last century of the old empire, the Peloponnese was ruled from Mystras by the emperor's brothers. The office of Despot is revived, and the Moreots get a Roman prince of their own."
 X09_thessalonica_second_city:0 "Thessalonica, Second City"
 X09_thessalonica_second_city_desc:0 "Thessalonica was the second city of the empire for a thousand years. It will be again."
 X09_reforming_autocrat:0 "The Reforming Autocrat"
 X09_reforming_autocrat_desc:0 "Michael VI rules alone, and rules in a hurry."
 X09_rule_of_the_tagmata:0 "Rule of the Tagmata"
 X09_rule_of_the_tagmata_desc:0 "The army governs the empire."
 X09_senatorial_charter:0 "The Senatorial Charter"
 X09_senatorial_charter_desc:0 "The Senate of New Rome governs; the emperor reigns."
 X09_roman_pride:0 "Neither Latin nor Mongol"
 X09_roman_pride_desc:0 "Byzantium is nobody's frontier but its own."
 X09_reformed_themes:0 "The Reformed Themes"
 X09_reformed_themes_desc:0 "Every province is a military district, and every district has a governor who answers to Sinop."
 X09_golden_bezant:0 "The Golden Bezant"
 X09_golden_bezant_desc:0 "A sound currency for a serious empire."
 X09_army_of_new_rome:0 "An Army of New Rome"
 X09_army_of_new_rome_desc:0 "One army, worthy of the name of Rome."
 X09_ecumenical_throne:0 "The Ecumenical Throne"
 X09_ecumenical_throne_desc:0 "The Patriarch is home in Constantinople."
 X09_new_rome:0 "New Rome"
 X09_new_rome_desc:0 "The Emperor of the Romans rules from the Queen of Cities."
 X09_triumphal_tradition:0 "The Triumphal Tradition"
 X09_triumphal_tradition_desc:0 "Every reconquered province earns a procession, a holiday and a new mosaic."
 X09_restored_oikoumene:0 "The Restored Oikoumene"
 X09_restored_oikoumene_desc:0 "Romans live under Roman law from Thrace to the Euphrates."
 X09_pax_romana:0 "Pax Romana"
 X09_pax_romana_desc:0 "Roman roads, Roman courts and Roman coins."
 X09_hesychast_revival:0 "Hesychast Revival"
 X09_hesychast_revival_desc:0 "Pilgrims crowd the cave monasteries of Cappadocia."
 X09_the_blues:0 "Patron of the Blues"
 X09_the_blues_desc:0 "The emperor sits with the old families and the officers' mess."
 X09_the_greens:0 "Patron of the Greens"
 X09_the_greens_desc:0 "The emperor sits with the harbour, the guilds and the merchant houses."
 X09_purple_ink:0 "Purple Ink"
 X09_purple_ink_desc:0 "One signature, in one colour, from one desk."
 X09_silk_monopoly:0 "The Imperial Silk Monopoly"
 X09_silk_monopoly_desc:0 "Every silkworm in Antioch belongs to the emperor."
 X09_imperial_economy:0 "An Economy Fit for an Empire"
 X09_imperial_economy_desc:0 "The Basileia can afford its ambitions."
 X09_magnaura:0 "The University of the Magnaura"
 X09_magnaura_desc:0 "Scholars from across the Orthodox world study in Constantinople."
 X09_orthodox_commonwealth:0 "An Orthodox Commonwealth"
 X09_orthodox_commonwealth_desc:0 "Two states, one Church."
 X09_michael_gabras:0 "Michael VI Gabras"
 X09_nikephoros_vranas:0 "Nikephoros Vranas"
 X09_konstantinos_laskaris:0 "Konstantinos Laskaris"
 X09_patriarch_photios:0 "Patriarch Photios IV"
 X09_ioannis_akropolites:0 "Ioannis Akropolites"
 X09_manuel_apokaukos:0 "Manuel Apokaukos"
 X09_leon_kekaumenos:0 "Leon Kekaumenos"
 X09_harald_eiriksson:0 "Harald Eiriksson"
 X09_alexios_notaras:0 "Megas Doux Alexios Notaras"
 X09_theophano_doukaina:0 "Theophano Doukaina"
 X09_ioannis_kourkouas:0 "Ioannis Kourkouas"
 X09_leontios_skleros:0 "Leontios Skleros"
 X09_orthodox_league:0 "Orthodox League"
 X09_roman_empire:0 "Roman Empire"
 X09_roman_empire_ADJ:0 "Roman"
 X09_roman_empire_DEF:0 "the Roman Empire"
 byzantium.1.t:0 "A Roman Emperor in Constantinople"
 byzantium.1.d:0 "Six centuries after the crusaders of Guillen III broke the old empire, and long after the Cumans left the City in ashes, a Roman emperor has ridden through the Golden Gate of Constantinople. The [From.GetNameDef] has taken the ruined city and declared it once more the capital of the Romans. In the shell of Hagia Sophia, the Ecumenical Patriarch's choir sang for the first time in living memory."
 byzantium.1.a:0 "The City is ours."
 byzantium.1.b:0 "The Byzantines are back on the Bosporus."
 byzantium.3.a:0 "Of course they have."
 byzantium.3.t:0 "The Byzantines Have Switched Sides"
 byzantium.3.d:0 "This morning the Byzantine envoy in Saragossa presented a declaration of war, with the same courteous smile he wore last week while thanking the King for a shipment of rifles. Our ambassador in Sinop reports that the court there considers the whole affair to be in excellent taste."
 byzantium.8.a:0 "We should have read our own history books."
 byzantium.8.t:0 "The Romans Betray the Khan"
 byzantium.8.d:0 "Every Ilkhan is taught the story of Theodoros Gabras, the general who turned on his master in the middle of a war. Today his descendant has done it again, with our own rifles in the hands of his soldiers."
 byzantium.11.a:0 "Polla ta eti!"
 byzantium.11.t:0 "Triumph over the Cumans"
 byzantium.11.d:0 "Six hundred years after the burning of the City, the horsetail standards of Bithynia are carried behind the emperor's chariot. Old women in the crowd spit on them. Small boys run alongside, trying to touch the captured guns. The Patriarch, who has a long memory, refuses to smile."
 byzantium.12.a:0 "Polla ta eti!"
 byzantium.12.t:0 "Triumph of Ionia"
 byzantium.12.d:0 "Fig-sellers from Smyrna and silk-weavers from Bursa march in the triumph behind the captured Aragonese field guns. The crowd throws figs. The figs are, the Logothete notes, now subject to imperial excise."
 byzantium.13.a:0 "Polla ta eti!"
 byzantium.13.t:0 "Triumph of Thrace"
 byzantium.13.d:0 "The emperor rides out through the Charisius Gate and back in through the Golden Gate, which is not strictly the traditional route, but the protocol officer has been overruled. Thracian peasants line the road with bread and salt."
 byzantium.14.a:0 "Polla ta eti!"
 byzantium.14.t:0 "Triumph of the Pontus"
 byzantium.14.d:0 "The Pontic regiments march in the triumph in their sheepskin hats, dancing the serra with rifles in hand. The Armenian bishops who walk behind them carry relics that have not seen a Roman procession in five hundred years."
 byzantium.15.a:0 "Polla ta eti!"
 byzantium.15.t:0 "Triumph of Cyprus"
 byzantium.15.d:0 "The Megas Doux brings the triumph ashore at the harbour, sailors first, marines second, and a captured Ilkhanid gunboat towed behind. The Cypriot delegation brings wine. The procession is noticeably slower in its second half."
 byzantium.16.a:0 "Polla ta eti!"
 byzantium.16.t:0 "Triumph of Syria"
 byzantium.16.d:0 "Camels in a Roman triumph. The Master of Ceremonies had warned against it. The camels, unaware of protocol, eat the laurel wreaths off the triumphal arch, and the crowd agrees it is the best triumph in living memory."
 byzantium.17.a:0 "Polla ta eti!"
 byzantium.17.t:0 "Triumph of Hellas"
 byzantium.17.d:0 "The emperor enters Thessalonica by the Arch of Galerius, as emperors did sixteen hundred years ago. The welcome is warm in the churches and cool in the cafes, where a good many Hellenes still consider themselves Hellenes. The censors have been told to be patient."
 byzantium.18.a:0 "Polla ta eti!"
 byzantium.18.t:0 "Trajan's Triumph"
 byzantium.18.d:0 "No Roman emperor has ever held a triumph for Mesopotamia and kept it. The emperor, who has read his history, orders the triumph held in Baghdad instead of the City, on the reasonable grounds that he may not get another chance."
 byzantium.4.a:0 "Send in the Varangians."
 byzantium.4.b:0 "Pay for new stables. And new benches. And free bread."
 byzantium.4.t:0 "Riot in the Hippodrome"
 byzantium.4.d:0 "After a disputed finish in the Sunday race, the losing faction tore up the benches, set fire to the stables and marched on the palace chanting \"Nika!\", the old cry of the riot that nearly toppled Justinian. The Varangians are waiting for orders."
 byzantium.6.a:0 "Long live the Emperor."
 byzantium.6.t:0 "The Old Emperor Speaks"
 byzantium.6.d:0 "Tiberios V spoke for nearly an hour, which his physicians had forbidden. He reminded the court that Gabras had changed sides four times in his life and died in bed as emperor, that every enemy of Rome had eventually become a footnote, and that the mechanical lions needed oiling. Then he blessed his son, the Domestikos and the senators in turn, and asked to be carried back to his rooms."
 byzantium.5.a:0 "Give them axes for the ceremony and rifles for the front."
 byzantium.5.b:0 "Put the old man in charge of the regimental museum."
 byzantium.5.t:0 "Volunteers from the North"
 byzantium.5.d:0 "Several hundred Scandinavian volunteers have arrived in Sinop, most of them farm boys who have read too many sagas, a few of them veterans of the northern wars, and one of them a ninety-year-old who claims his grandfather served in the Guard. They ask to swear the Varangian oath."
 byzantium.7.a:0 "Bury him with the emperors."
 byzantium.7.t:0 "The Founder Comes Home"
 byzantium.7.d:0 "The procession carrying the remains of Theodoros Gabras stopped at every church between the Bosporus and the Holy Apostles. At the last of them, an elderly Ilkhanid diplomat stepped out of the crowd, bowed to the coffin and said, quite audibly, \"He still owes us an army.\" The crowd laughed. The emperor did not."
